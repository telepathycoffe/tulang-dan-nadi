<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b0b0b; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:-apple-system, sans-serif; padding:20px 0; }
.iphone { width:390px; height:844px; background:#fff; border-radius:55px; border:10px solid #1a1a1a; box-shadow:0 0 0 2px #555, 0 25px 60px rgba(0,0,0,0.6); position:relative; overflow:hidden; }
.status-bar { position:absolute; top:0; left:0; right:0; height:50px; display:flex; justify-content:space-between; align-items:center; padding:18px 26px 0; font-size:15px; font-weight:600; color:#000; z-index:9; }
.status-right { display:flex; align-items:center; gap:6px; }
.wallpaper { position:absolute; inset:0; background:url('cover.jpg') center/cover no-repeat; }
.lock-info { position:absolute; top:70px; left:0; right:0; text-align:center; color:#000; z-index:5; }
.lock-info .date { font-size:17px; font-weight:600; }
.lock-info .big-time { font-size:80px; font-weight:700; line-height:1; letter-spacing:-2px; }
.bottom { position:absolute; bottom:20px; left:0; right:0; z-index:5; display:flex; flex-direction:column; align-items:center; gap:10px; color:#000; }
.bottom .icons { width:100%; display:flex; justify-content:space-between; padding:0 30px; font-size:22px; }
.swipe { font-size:14px; font-weight:500; cursor:pointer; }
.home-bar { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:130px; height:5px; background:#000; border-radius:10px; z-index:10; }

/* Password Screen */
.passcode { display:none; position:absolute; inset:0; background:rgba(0,0,0,0.88); backdrop-filter:blur(10px); z-index:20; flex-direction:column; align-items:center; color:white; padding-top:90px; }
.passcode.active { display:flex; }
.passcode h3 { font-weight:400; font-size:18px; }
.dots { display:flex; gap:18px; margin:25px 0 35px; }
.dot { width:12px; height:12px; border-radius:50%; border:1.5px solid white; }
.dot.filled { background:white; }
.keypad { display:grid; grid-template-columns:repeat(3,70px); gap:16px; }
.key { width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; justify-content:center; align-items:center; font-size:30px; color:white; cursor:pointer; }
.key:active { background:rgba(255,255,255,0.35); }
.cancel { margin-top:30px; opacity:0.8; cursor:pointer; }
</style>
</head>
<body>
<div class="iphone">
  <div class="status-bar">
    <span>19.05</span>
    <div class="status-right">
      <span>▂▄▆</span><span>5G</span>
      <svg width="16" height="12" viewBox="0 0 24 18" fill="none"><path d="M2 6C8 1 16 1 22 6M5 10c3.5-3.5 10.5-3.5 14 0M8 14c1.8-1.8 6.2-1.8 8 0" stroke="black" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.5" fill="black"/></svg>
      <span style="width:25px; height:12px; border:1.5px solid #000; border-radius:3px; position:relative; display:inline-block;"><span style="position:absolute; left:2px; top:2px; bottom:2px; width:70%; background:#000; border-radius:2px;"></span></span>
    </div>
  </div>
  <div class="wallpaper"></div>

  <div class="lock-info">
    <div class="date">Thu 22 Oct </div>
    <div class="big-time">19.05</div>
  </div>

  <div class="bottom">
    <div class="icons"><span>🔦</span><span>📷</span></div>
    <div class="swipe" onclick="openPass()">Swipe up to open</div>
  </div>
  <div class="home-bar"></div>

  <div id="passcodeScreen" class="passcode">
    <h3>Enter Passcode</h3>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="keypad">
      <div class="key" onclick="press('1')">1</div>
      <div class="key" onclick="press('2')">2</div>
      <div class="key" onclick="press('3')">3</div>
      <div class="key" onclick="press('4')">4</div>
      <div class="key" onclick="press('5')">5</div>
      <div class="key" onclick="press('6')">6</div>
      <div class="key" onclick="press('7')">7</div>
      <div class="key" onclick="press('8')">8</div>
      <div class="key" onclick="press('9')">9</div>
      <div class="key" onclick="press('del')" style="font-size:20px;">⌫</div>
      <div class="key" onclick="press('0')">0</div>
      <div class="key" onclick="closePass()" style="font-size:16px; background:transparent;">Cancel</div>
    </div>
  </div>
</div>

<script>
let code = "";
function openPass(){ document.getElementById("passcodeScreen").classList.add("active"); }
function closePass(){ document.getElementById("passcodeScreen").classList.remove("active"); code=""; updateDots(); }
function press(n){
  if(n==="del"){ code = code.slice(0,-1); }
  else if(code.length < 6){ code += n; }
  updateDots();
  if(code.length === 6){
    if(code === "199597"){
      window.location.href = "wa-list.html";
    } else {
      document.querySelector(".passcode h3").textContent = "Passcode Salah, Coba Lagi";
      setTimeout(()=>{
        code = "";
        updateDots();
        document.querySelector(".passcode h3").textContent = "Enter Passcode";
      }, 900);
    }
  } 
}
function updateDots(){
  document.querySelectorAll(".dot").forEach((d,i)=>{ d.classList.toggle("filled", i < code.length); });
}
</script>
</body>
</html>
