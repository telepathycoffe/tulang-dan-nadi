<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lock Screen</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow:hidden; }
  .lockscreen {
    position:relative; width:100vw; height:100dvh;
    background:url('cover%201.jpg') center/cover no-repeat;
    color:#000; overflow:hidden;
  }
  .statusbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 22px 0 22px; font-size:15px; font-weight:600; z-index:10;
  }
  .status-icons { display:flex; gap:5px; align-items:center; }
  .date { position:absolute; top:70px; width:100%; text-align:center; font-size:16px; font-weight:600; }
  .time { position:absolute; top:95px; width:100%; text-align:center; font-size:74px; font-weight:700; letter-spacing:-2px; line-height:1; }

  .bottom-btns {
    position:absolute; bottom:45px; width:100%;
    display:flex; justify-content:space-between; padding:0 24px; z-index:10;
  }
  .btn {
    width:48px; height:48px; border-radius:50%;
    background:rgba(60,60,60,0.4);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:grid; place-items:center;
  }
  .btn svg { width:22px; height:22px; fill:white; }
  .swipe {
    position:absolute; bottom:12px; width:100%; text-align:center;
    font-size:13px; font-weight:500; color:#000; opacity:0.6; z-index:10;
  }
  .home-bar {
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; background:#000; border-radius:5px; opacity:0.8; z-index:10;
  }

  /* Notification Centre */
  .notif-center {
    position:absolute; top:55px; left:0; right:0; bottom:90px;
    padding:0 12px; z-index:5; overflow:hidden;
  }
  .notif-topbar {
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-size:22px; font-weight:700; margin-bottom:14px;
    text-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  .close-btn {
    width:28px; height:28px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.3); color:#fff; font-size:18px; line-height:1;
  }
  .notif-group-header {
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-size:16px; font-weight:600; margin-bottom:8px;
    text-shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  .group-actions { display:flex; gap:8px; align-items:center; font-size:13px; font-weight:500; }
  .group-actions span {
    background:rgba(0,0,0,0.3); padding:4px 10px; border-radius:12px;
  }
  .notif-card {
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:20px; padding:12px 14px;
    display:flex; gap:10px; align-items:flex-start;
    margin-bottom:10px; color:#000;
  }
  .notif-card .avatar {
    width:38px; height:38px; border-radius:50%; object-fit:cover;
  }
  .notif-content { flex:1; }
  .notif-line1 { display:flex; justify-content:space-between; font-size:14px; }
  .notif-line1 b { font-weight:700; }
  .notif-line1 .now { font-size:12px; opacity:0.7; }
  .notif-msg { font-size:14px; margin-top:2px; }
  .wa-badge {
    width:20px; height:20px; background:#25D366; border-radius:50%;
    display:grid; place-items:center; color:#fff; font-size:11px; margin-top:2px;
  }
  .battery-widget {
    position:absolute; bottom:0; left:14px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.5);
  }
  .battery-widget .batt-row { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:600; }
  .battery-widget .tulang { font-size:14px; margin-top:2px; font-weight:500; }
  .battery-bar {
    width:160px; height:5px; background:rgba(255,255,255,0.4); border-radius:5px; margin-top:6px; overflow:hidden;
  }
  .battery-bar .fill { width:98%; height:100%; background:#fff; border-radius:5px; }

  .passcode {
    position:absolute; left:0; right:0; bottom:90px;
    text-align:center; display:none; z-index:8;
  }
  .passcode h3 { font-size:17px; margin-bottom:12px; font-weight:600; }
  .dots { display:flex; justify-content:center; gap:12px; margin-bottom:18px; }
  .dot { width:10px; height:10px; border-radius:50%; border:1.5px solid #000; background:transparent; }
  .dot.filled { background:#000; }
  .pad {
    display:grid; grid-template-columns:repeat(3, 72px);
    gap:14px; justify-content:center;
  }
  .pad button {
    width:72px; height:72px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.18); backdrop-filter:blur(6px);
    font-size:30px; font-weight:400; color:#000;
  }
  .pad button:active { background:rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div class="lockscreen" id="lock">
  <div class="statusbar">
    <span id="statusTime">16.51</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="black"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="black"/><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="black"/></svg>
      <span style="font-size:13px; font-weight:700;">5G</span>
      <svg width="18" height="12" viewBox="0 0 18 12" fill="black"><path d="M9 9.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zM5.4 7.2a5.1 5.1 0 0 1 7.2 0l-1.5 1.5a3 3 0 0 0-4.2 0L5.4 7.2zm-3-3a9.2 9.2 0 0 1 13.2 0l-1.5 1.5a7 7 0 0 0-10.2 0L2.4 4.2zM.9 1.7a12.8 12.8 0 0 1 16.2 0l-1.5 1.5a11 11 0 0 0-13.2 0L.9 1.7z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" opacity="0.4" fill="none"/><rect x="2" y="2" width="16" height="8" rx="2" fill="black"/><path d="M23 4v4a2 2 0 0 0 2 0V4a2 2 0 0 0-2 0z" fill="black" opacity="0.4"/></svg>
    </div>
  </div>

  <div class="date" id="dateText">Thu 22 Oct</div>
  <div class="time" id="bigTime">16.51</div>

  <div class="notif-center" id="notifCenter">
    <div class="notif-topbar">
      <span>Notification Centre</span>
      <button class="close-btn" onclick="document.getElementById('notifCenter').style.display='none'">×</button>
    </div>

    <div class="notif-group-header">
      <span>WhatsApp</span>
      <div class="group-actions">
        <span>∨ Show less</span>
        <button class="close-btn" style="width:24px;height:24px;font-size:15px;">×</button>
      </div>
    </div>

    <div class="notif-card">
      <img src="https://i.pravatar.cc/100?img=12" class="avatar">
      <div class="notif-content">
        <div class="notif-line1"><b>lio</b><span class="now">now</span></div>
        <div class="notif-msg">mau ajak kemana emg lang?</div>
      </div>
      <div class="wa-badge">✆</div>
    </div>

    <div class="notif-card">
      <img src="https://i.pravatar.cc/100?img=32" class="avatar">
      <div class="notif-content">
        <div class="notif-line1"><b>arash</b><span class="now">now</span></div>
        <div class="notif-msg">gue tonjok lo bangsat</div>
      </div>
      <div class="wa-badge">✆</div>
    </div>

    <div class="battery-widget">
      <div class="batt-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4"/></svg>
        98%
      </div>
      <div class="tulang">tulang</div>
      <div class="battery-bar"><div class="fill"></div></div>
    </div>
  </div>

  <div class="passcode" id="passcodeUI">
    <h3>Enter Passcode</h3>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button style="background:transparent;"></button>
      <button onclick="press(0)">0</button>
      <button style="background:transparent; font-size:22px;" onclick="deleteDigit()">⌫</button>
    </div>
  </div>

  <div class="bottom-btns">
    <div class="btn">
      <svg viewBox="0 0 24 24"><path d="M7 2h10v3l2 3v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8l2-3V2zm2 2v1.2l-.8 1.3h7.6L15 5.2V4H9zm1 5h4l1.5 2.2V19h-7V9.2L10 7z"/></svg>
    </div>
    <div class="btn">
      <svg viewBox="0 0 24 24"><path d="M4 7h2.5l1.5-2h8L17.5 7H20a1.5 1.5 0 0 1 1.5 1.5V19a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 19V9.5A1.5 1.5 0 0 1 4 7zm8 10.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0-2a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
  </div>

  <div class="swipe" id="swipeText">Swipe up to open</div>
  <div class="home-bar"></div>
</div>

<script>
  function updateClock(){
    const now = new Date();
    let h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const timeStr = h + "." + m;
    document.getElementById('bigTime').textContent = timeStr;
    document.getElementById('statusTime').textContent = timeStr;
    const wd = now.toLocaleDateString('en-US', { weekday:'short' });
    const mo = now.toLocaleDateString('en-US', { month:'short' });
    const d = now.getDate();
    document.getElementById('dateText').textContent = `${wd} ${d} ${mo}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  let code = "";
  document.getElementById('lock').addEventListener('touchstart', function(){
    document.getElementById('notifCenter').style.display = 'none';
    document.getElementById('passcodeUI').style.display = 'block';
    document.getElementById('swipeText').style.display = 'none';
  });

  function press(n){
    if(code.length >= 6) return;
    code += n;
    updateDots();
    if(code.length === 6){
      if(code === "199597"){
        document.querySelector(".passcode h3").textContent = "Unlocked!";
        setTimeout(()=>{ document.getElementById('lock').style.opacity = '0'; document.getElementById('lock').style.transition = 'opacity 0.4s'; }, 400);
      } else {
        document.querySelector(".passcode h3").textContent = "Wrong Passcode";
        setTimeout(()=>{
          code = "";
          updateDots();
          document.querySelector(".passcode h3").textContent = "Enter Passcode";
        }, 900);
      }
    }
  }
  function deleteDigit(){
    code = code.slice(0, -1);
    updateDots();
  }
  function updateDots(){
    let dots = document.querySelectorAll(".dot");
    dots.forEach((d,i)=>{ d.classList.toggle("filled", i < code.length); });
  }
</script>
</body>
</html>
