<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lock Screen</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow:hidden; }
     .homescreen {
  position:fixed; inset:0; z-index:1;
  background:url('homescreen.jpg') center/cover no-repeat;
}
.lockscreen {
  position:fixed; inset:0; z-index:10;
  background:url('cover%201.jpg') center/cover no-repeat;
  color:#fff; overflow:hidden;
  }
  .statusbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 22px 0 22px; font-size:15px; font-weight:600; z-index:10;
    color:#fff;
  }
  .status-left { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; }
  .status-icons { display:flex; gap:6px; align-items:center; }

  /* Gembok + Tanggal + Jam di tengah, di atas */
  .center-top {
    position:absolute; top:70px; width:100%;
    display:flex; flex-direction:column; align-items:center; z-index:5;
  }
  .lock-icon svg { width:18px; height:18px; fill:#fff; margin-bottom:6px; }
.date { font-size:17px; font-weight:600; margin-bottom:2px; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,0.5); }
.time {
  font-size:64px; font-weight:700; letter-spacing:-2px; line-height:1;
  color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.5);
  }

  .bottom-btns {
  position: absolute;
  bottom: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 32px;
  pointer-events: none;
  }
  .btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  }
  .btn svg { width:26px; height:26px; }
  .swipe {
    position:absolute; bottom:16px; width:100%; text-align:center;
    font-size:13px; font-weight:500; color:#000; opacity:0.6; z-index:10;
  }
  .home-bar {
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; background:#000; border-radius:5px; opacity:0.8; z-index:10;
  }

  .passcode {
    position:absolute; left:0; right:0; bottom:90px;
    text-align:center; display:none; z-index:8;
  }
  .passcode h3 { font-size:17px; margin-bottom:12px; font-weight:600; colour:#fff }
  .dots { display:flex; justify-content:center; gap:12px; margin-bottom:18px; }
  .dot { width:10px; height:10px; border-radius:50%; border:1.5px solid #fff; background:transparent; }
  .dot.filled { background:#fff; }
  .pad {
    display:grid; grid-template-columns:repeat(3, 72px);
    gap:14px; justify-content:center;
  }
  .pad button {
    width:72px; height:72px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.25); backdrop-filter:blur(6px);
    font-size:30px; font-weight:400; color:#fff;
  }
  .pad button:active { background:rgba(255,255,255,0.4); }
   .apps-grid.simple {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px 10px;
  padding: 60px 16px 0 16px;
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.app span {
  color: #fff;
  font-size: 12px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.7);
}

.app-icon, .dock-icon {
  width: 60px; height: 60px;
  border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.wa { background: #25D366; }
.photos { background: linear-gradient(135deg, #fff, #ddd); color: #000; }
.x { background: #000; border: 1px solid #333; }
.ig { background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf); }
.cam { background: #8e8e93; }
.netflix { background: #E50914; font-size: 28px; }

.dock {
  position: absolute; bottom: 12px; left: 10px; right: 10px;
  height: 78px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(15px);
  border-radius: 26px;
  display: flex; justify-content: space-around; align-items: center;
}
.dock-icon { width: 60px; height: 60px; position: relative; }
.phone { background: #34C759; border-radius: 15px; }
.safari { background: #fff; color: #007AFF; border-radius: 15px; }
.messages { background: #34C759; border-radius: 15px; }
.music { background: #FC3C44; border-radius: 15px; }

.badge {
  position: absolute; top: -8px; right: -8px;
  background: red; color: #fff;
  font-size: 12px; font-weight: 700;
  min-width: 22px; height: 22px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
   <div class="homescreen">
  <div class="apps-grid simple"> ... </div>
  <div class="dock"> Phone Safari Chat Music </div>
</div>

<div class="lockscreen" id="lock">
  <div class="statusbar">
    <div class="status-left">
      <span>XL-Axiata</span>
    </div>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="white"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="white"/><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="white"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="white"/></svg>
      <span style="font-size:13px; font-weight:700;">5G</span>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" opacity="0.4" fill="none"/><rect x="2" y="2" width="16" height="8" rx="2" fill="white"/><path d="M23 4v4a2 2 0 0 0 2 0V4a2 2 0 0 0-2 0z" fill="white" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- GEMBOK DI ATAS DATE -->
  <div class="center-top">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
    </div>
    <div class="date" id="dateText">Thu 22 Oct</div>
    <div class="time" id="bigTime">17.16</div>
  </div>

  <div class="passcode" id="passcodeUI">
    <h3>Enter Passcode</h3>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button style="background:transparent;"></button>
      <button onclick="press(0)">0</button>
      <button style="background:transparent; font-size:22px;" onclick="deleteDigit()">⌫</button>
    </div>
  </div>

  <div class="bottom-btns">
    <div class="btn">
      <!-- KALKULATOR -->
     <svg viewBox="0 0 24 24"><mask id="calc"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="white"/><rect x="8.2" y="5" width="7.6" height="3.6" rx="1" fill="black"/><circle cx="9.5" cy="11.2" r="1.1" fill="black"/><circle cx="12" cy="11.2" r="1.1" fill="black"/><circle cx="14.5" cy="11.2" r="1.1" fill="black"/><circle cx="9.5" cy="13.8" r="1.1" fill="black"/><circle cx="12" cy="13.8" r="1.1" fill="black"/><circle cx="14.5" cy="13.8" r="1.1" fill="black"/><circle cx="9.5" cy="16.4" r="1.1" fill="black"/><circle cx="12" cy="16.4" r="1.1" fill="black"/><circle cx="14.5" cy="16.4" r="1.1" fill="black"/></mask><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="white" mask="url(#calc)"/></svg>
    </div>
       <div class="btn">
      <svg viewBox="0 0 24 24" fill="white"><path d="M4 7h2.5l1.5-2h8L17.5 7H20a1.5 1.5 0 0 1 1.5 1.5V19a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 19V9.5A1.5 1.5 0 0 1 4 7zm8 10.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0-2a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
  </div>

  <div class="swipe" id="swipeText">Swipe up to open</div>
  <div class="home-bar"></div>
</div>
<div class="apps-grid simple">
  <div class="app">
    <div class="app-icon wa">WA</div>
    <span>WhatsApp</span>
  </div>
  <div class="app">
    <div class="app-icon photos">Photos</div>
    <span>Photos</span>
  </div>
  <div class="app">
    <div class="app-icon x">X</div>
    <span>X</span>
  </div>
  <div class="app">
    <div class="app-icon ig">IG</div>
    <span>Instagram</span>
  </div>
  <div class="app">
    <div class="app-icon cam">Cam</div>
    <span>Kamera</span>
  </div>
  <div class="app">
    <div class="app-icon netflix">N</div>
    <span>Netflix</span>
  </div>
</div>

<div class="search-pill">Q Search</div>

<div class="dock">
  <div class="dock-icon phone">Phone</div>
  <div class="dock-icon safari">Safari</div>
  <div class="dock-icon messages">Chat <span class="badge">21</span></div>
  <div class="dock-icon music">Music</div>
</div>
   
<script>
  function updateClock(){
    const now = new Date();
    let h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    document.getElementById('bigTime').textContent = h + "." + m;
    const wd = now.toLocaleDateString('en-US', { weekday:'short' });
    const mo = now.toLocaleDateString('en-US', { month:'short' });
    const d = now.getDate();
    document.getElementById('dateText').textContent = `${wd} ${d} ${mo}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  let code = "";
  document.getElementById('lock').addEventListener('touchstart', function(){
    document.getElementById('passcodeUI').style.display = 'block';
    document.getElementById('swipeText').style.display = 'none';
  });

  function press(n){
    if(code.length >= 6) return;
    code += n;
    updateDots();
    if(code.length === 6){
      if(code === "199597"){
        document.querySelector(".passcode h3").textContent = "Unlocked!";
        setTimeout(()=>{ document.getElementById('lock').style.opacity = '0'; document.getElementById('lock').style.transition = 'opacity 0.4s'; }, 400);
      } else {
        document.querySelector(".passcode h3").textContent = "Wrong Passcode";
        setTimeout(()=>{
          code = "";
          updateDots();
          document.querySelector(".passcode h3").textContent = "Enter Passcode";
        }, 900);
      }
    }
  }
  function deleteDigit(){
    code = code.slice(0, -1);
    updateDots();
  }
  function updateDots(){
    let dots = document.querySelectorAll(".dot");
    dots.forEach((d,i)=>{ d.classList.toggle("filled", i < code.length); });
  }
</script>
</body>
</html>
