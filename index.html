<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b0b0b; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:-apple-system, sans-serif; padding:20px 0; }

.iphone { width:390px; height:844px; background:#fff; border-radius:55px; border:10px solid #1a1a1a; box-shadow:0 0 0 2px #555, 0 25px 60px rgba(0,0,0,0.6); position:relative; overflow:hidden; }

.dynamic-island { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:32px; background:#000; border-radius:20px; z-index:10; }

.status-bar { position:absolute; top:0; left:0; right:0; height:50px; display:flex; justify-content:space-between; align-items:center; padding:18px 28px 0; font-size:15px; font-weight:600; color:#fff; z-index:9; }

.wallpaper { position:absolute; inset:0; background:url('cover.jpg') center/cover no-repeat; }

.lock-info { position:absolute; top:70px; left:0; right:0; text-align:center; color:#fff; z-index:5; }
.lock-info .date { font-size:17px; font-weight:600; }
.lock-info .big-time { font-size:80px; font-weight:700; line-height:1; letter-spacing:-2px; }

.bottom { position:absolute; bottom:20px; left:0; right:0; z-index:5; display:flex; flex-direction:column; align-items:center; gap:12px; color:#fff; }
.bottom .icons { width:100%; display:flex; justify-content:space-between; padding:0 30px; font-size:20px; }
.swipe { font-size:14px; font-weight:500; }

.home-bar { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:130px; height:5px; background:#000; border-radius:10px; z-index:10; }

a.swipe-link { color:#000; text-decoration:none; }

@media (max-width: 450px) {
  .iphone { transform:scale(0.88); }
}
</style>
</head>
<body>
<div class="iphone">
  <div class="dynamic-island"></div>
  <div class="status-bar"><span>19.05</span><span>5G ▰ ▮</span></div>
  <div class="wallpaper"></div>

  <div class="lock-info">
    <div class="date">Sat 17 Oct</div>
    <div class="big-time">19.05</div>
  </div>

  <div class="bottom">
    <div class="icons"><span>🔦</span><span>📷</span></div>
    <a href="wa-list.html" class="swipe-link"><div class="swipe">Swipe up to open</div></a>
  </div>

  <div class="home-bar"></div>
</div>
</body>
</html>
