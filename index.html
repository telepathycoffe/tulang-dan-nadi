<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lock Screen</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    overflow:hidden;
  }
  .lockscreen {
    position:relative;
    width:100vw;
    height:100dvh;
    background:url('cover%201.jpg') center/cover no-repeat;
    color:#000;
    overflow:hidden;
  }
  .statusbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 24px 0 24px; font-size:16px; font-weight:600; z-index:2;
  }
  .status-icons {
    display:flex; gap:5px; align-items:center; font-size:13px; font-weight:700;
  }
  .date {
    position:absolute; top:75px; width:100%; text-align:center;
    font-size:16px; font-weight:600;
  }
  .time {
    position:absolute; top:100px; width:100%; text-align:center;
    font-size:76px; font-weight:700; letter-spacing:-2px; line-height:1;
  }
  .swipe {
    position:absolute; bottom:28px; width:100%; text-align:center;
    font-size:14px; font-weight:500; color:#000; opacity:0.6;
  }
  .home-bar {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; background:#000; border-radius:5px; opacity:0.8;
  }
  .bottom-btns {
  position:absolute; bottom:50px; width:100%;
  display:flex; justify-content:space-between; padding:0 26px;
}
.btn {
  width:48px; height:48px; border-radius:50%;
  background:rgba(80,80,80,0.35);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:grid; place-items:center;
}
.btn svg { width:24px; height:24px; fill:white; }

  .passcode { position:absolute; bottom:140px; width:100%; text-align:center; display:none; }
  .passcode h3 { font-size:17px; margin-bottom:15px; font-weight:600; }
  .dots { display:flex; justify-content:center; gap:15px; margin-bottom:20px; }
  .dot { width:12px; height:12px; border-radius:50%; border:1.5px solid #000; }
  .dot.filled { background:#000; }
  .pad { display:grid; grid-template-columns:repeat(3, 70px); gap:14px; justify-content:center; }
  .pad button {
    width:70px; height:70px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.12); font-size:28px; font-weight:500; color:#000;
  }
</style>
</head>
<body>
<div class="lockscreen" id="lock">
  <div class="statusbar">
    <span id="statusTime">19.05</span>
    <div class="status-icons">📶 5G 📶 🔋</div>
  </div>

  <div class="date" id="dateText">Thu 22 Oct</div>
  <div class="time" id="bigTime">19.05</div>

  <div class="passcode" id="passcodeUI">
    <h3>Enter Passcode</h3>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button onclick="press(0)">0</button>
    </div>
  </div>

<div class="bottom-btns">
  <div class="btn">
    <svg viewBox="0 0 24 24" fill="white"><path d="M9 2h6v3l2 3v11a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V8l2-3V2zm1 12v4h4v-4h-4z"/></svg>
  </div>
  <div class="btn">
    <svg viewBox="0 0 24 24" fill="white"><path d="M4 8h3l2-2h6l2 2h3v11H4V8zm8 9a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>
  </div>
</div>

<script>
  function updateClock(){
    const now = new Date();
    let h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const timeStr = h + "." + m;

    document.getElementById('bigTime').textContent = timeStr;
    document.getElementById('statusTime').textContent = timeStr;

    const wd = now.toLocaleDateString('en-US', { weekday:'short' });
    const mo = now.toLocaleDateString('en-US', { month:'short' });
    const d = now.getDate();
    document.getElementById('dateText').textContent = `${wd} ${d} ${mo}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  let code = "";
  document.getElementById('lock').addEventListener('touchstart', function(){
    document.getElementById('passcodeUI').style.display = 'block';
    document.getElementById('swipeText').style.display = 'none';
  });

  function press(n){
    if(code.length >= 6) return;
    code += n;
    updateDots();
    if(code.length === 6){
      if(code === "199597"){
        document.querySelector(".passcode h3").textContent = "Unlocked!";
      } else {
        document.querySelector(".passcode h3").textContent = "Wrong Passcode";
        setTimeout(()=>{
          code = "";
          updateDots();
          document.querySelector(".passcode h3").textContent = "Enter Passcode";
        }, 900);
      }
    }
  }
  function updateDots(){
    let dots = document.querySelectorAll(".dot");
    dots.forEach((d,i)=>{ d.classList.toggle("filled", i < code.length); });
  }
</script>
</body>
</html>
