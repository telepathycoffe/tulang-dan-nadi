<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; background:#1c1c1e; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:-apple-system, sans-serif; }

.iphone { width:390px; height:844px; background:white; border-radius:55px; border:12px solid #111; box-shadow:0 0 0 2px #444, 0 30px 60px rgba(0,0,0,0.5); position:relative; overflow:hidden; }

.notch { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:30px; background:#111; border-radius:20px; z-index:99; }

.status { position:absolute; top:0; left:0; right:0; height:50px; display:flex; justify-content:space-between; align-items:center; padding:15px 25px 0; font-weight:600; font-size:15px; z-index:98; background:white; }
.status span:last-child { font-size:13px; }

.screen { position:absolute; top:50px; bottom:0; left:0; right:0; overflow-y:auto; background:#fff; }

.wa-header { background:#008069; color:white; padding:12px 15px; font-weight:700; }
.chat { display:flex; padding:15px; border-bottom:1px solid #eee; }
.foto { width:50px; height:50px; border-radius:50%; background:url('cover.jpg') center/cover; margin-right:12px; }
.home { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:130px; height:5px; background:#111; border-radius:10px; z-index:99; }

@media (max-width: 500px) {
  body { background:white; display:block; }
  .iphone { width:100vw; height:100vh; border-radius:0; border:none; box-shadow:none; }
  .notch, .home { display:none; }
  .status { display:none; }
  .screen { top:0; }
}
</style>
</head>
<body>
<div class="iphone">
  <div class="notch"></div>
  <div class="status"><span>3:05</span><span>5G</span></div>

  <div class="screen">
    <div class="wa-header">WhatsApp</div>
    <div class="chat">
      <div class="foto"></div>
      <div><b>NADI</b><p>Tulang: [POV 1] ...</p></div>
    </div>
  </div>

  <div class="home"></div>
</div>
</body>
</html>
