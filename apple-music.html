<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - Apple Music</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 150px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 20px 0;
  }
  .header h1 { font-size: 34px; font-weight: 800; margin: 0; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #2c2c2e; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; border: 1.5px solid #555;
  }

  .search-bar {
    margin: 12px 20px;
    background: #1c1c1e; border-radius: 12px;
    padding: 11px 14px; color: #98989d; font-size: 15px;
    display: flex; gap: 8px; align-items: center;
 }
    .search-icon-svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 4px 20px;
  }

  .tile {
    height: 120px;
    border-radius: 16px;
    padding: 12px 14px;
    font-weight: 700;
    font-size: 17px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }
  .tile span { position: relative; z-index: 3; line-height: 1.2; }

  .tile img.artist {
    position: absolute;
    right: 0;
    bottom: 0;
    height: 100%;
    width: 62%;
    object-fit: cover;
    object-position: top center;
    opacity: 0.95;
    z-index: 1;
  }

  /* Warna persis kayak SS */
  .t-radio { background: #E4002B; }
  .t-kpop { background: #FF8FA3; }
  .t-indo { background: #2A4BFF; }
  .t-pop { background: #FF9EB5; }
  .t-alt { background: #D6B700; }
  .t-rock { background: #FF6A2B; }
  .t-rnb { background: #8A6DFF; }
  .t-hiphop { background: #6A9BFF; }
  .t-dance { background: #00C15A; }
  .t-charts { background: #5A6B00; }
  .t-sing { background: #FF6B7A; }
  .t-dj { background: linear-gradient(90deg, #7A00FF, #00E5FF, #FF0055); }

  .t-sing-icon {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 2;
    opacity: 0.95;
  }

 .now-playing {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
  .np-thumb { width: 38px; height: 38px; border-radius: 6px; background: linear-gradient(135deg,#ff8a00,#e52e71); flex-shrink: 0; }: 0; }
  .np-info { flex: 1; min-width: 0; }
  .np-info b { display: block; font-size: 15px; font-weight: 600; }
  .np-info p { margin: 1px 0 0; font-size: 13px; color: #98989d; }
  .np-play {
  width: 32px; height: 32px;
  background: rgba(58,58,60,0.9);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  margin-left: auto;
  flex-shrink: 0;
}
.np-play svg {
  width: 18px;
  height: 18px;
  fill: #0a84ff;
  display: block;
}
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #000; border-top: 0.5px solid #2c2c2e;
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 0 28px; z-index: 100;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; color: #98989d; font-size: 11px; }
  .tab-item.active { color: #fff; }
  .tab-item svg { width: 24px; height: 24px; margin-bottom: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>Search</h1>
  <div class="avatar">RL</div>
</div>

<div class="search-bar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98989d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
  <circle cx="11" cy="11" r="7"></circle>
  <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
</svg>
  <span>Artists, Songs, Lyrics, and More</span>
</div>

<div class="grid">
  <div class="tile t-radio">
    <img class="artist" src="raye.jpg">
    <span>Apple Music<br>Radio</span>
  </div>
  <div class="tile t-kpop">
    <img class="artist" src="bts.jpg">
    <span>K-Pop</span>
  </div>
  <div class="tile t-indo">
    <img class="artist" src="feby.jpg">
    <span>Indonesian<br>Music</span>
  </div>
  <div class="tile t-pop">
    <img class="artist" src="ariana.jpg">
    <span>Pop</span>
  </div>
  <div class="tile t-alt">
    <img class="artist" src="hindia.jpg">
    <span>Alternative</span>
  </div>
  <div class="tile t-rock">
    <img class="artist" src="a7x.jpg">
    <span>Rock</span>
  </div>
  <div class="tile t-rnb">
    <img class="artist" src="alicia.jpg">
    <span>R&B</span>
  </div>
  <div class="tile t-hiphop">
    <img class="artist" src="lisa.jpg">
    <span>Hip-Hop/Rap</span>
  </div>
  <div class="tile t-dance">
    <img class="artist" src="cortis.jpg">
    <span>Dance</span>
  </div>
  <div class="tile t-charts">
    <img class="artist" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&q=80">
    <span>Charts</span>
  </div>
  <div class="tile t-sing">
    <img class="artist" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80">
    <span>Sing</span>
  </div>
  <div class="tile t-dj">
    <img class="artist" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&q=80">
    <span>DJ with Apple Music</span>
  </div>
</div>

<div class="now-playing">
  <img class="np-thumb" src="lovely.jpg">
  <div class="np-info">
    <b>lovely</b>
    <p>Billie Eilish & Khalid</p>
  </div>
 <div class="np-play" id="playBtn">
  <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</div>
<audio id="lovelyAudio" src="Billie%20Eilish%20-%20lovely%20(Lyrics)%20ft.%20Khalid%20(1).mp3" preload="auto"></audio>
  
<div class="tabbar">
  <div class="tab-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 L12 3 L21 10.5 V20.5 H14.5 V14.5 H9.5 V20.5 H3 Z"/></svg>
    Home
  </div>
  <div class="tab-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    Search
  </div>
</div>
</div>
<script>
const audio = document.getElementById('lovelyAudio');
const btn = document.getElementById('playBtn');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');

btn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
  } else {
    audio.pause();
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
  }
});
</script>
</body>
</html>
