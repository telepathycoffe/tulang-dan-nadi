<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - Apple Music</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 150px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 20px 0;
  }
  .header h1 {
    font-size: 34px;
    font-weight: 800;
    margin: 0;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    border: 1.5px solid #555;
  }

  /* Search bar persis iPhone */
  .search-bar {
    margin: 14px 20px;
    background: #1c1c1e;
    border-radius: 12px;
    padding: 12px 14px;
    color: #98989d;
    font-size: 15px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .icon-search {
    width: 16px;
    height: 16px;
    border: 2px solid #98989d;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }
  .icon-search::after {
    content: '';
    position: absolute;
    width: 2.5px;
    height: 8px;
    background: #98989d;
    border-radius: 2px;
    transform: rotate(45deg);
    bottom: -8px;
    right: -5px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 4px 20px;
  }

  .tile {
    height: 110px;
    border-radius: 16px;
    padding: 14px;
    font-weight: 700;
    font-size: 17px;
    display: flex;
    align-items: flex-end;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .tile span { position: relative; z-index: 2; }

  .t-radio { background: #e50038; }
  .t-kpop { background: #ff7aa2; }
  .t-indo { background: #3b5bff; }
  .t-pop { background: #ff8fa8; }
  .t-alt { background: #d9b800; color: #fff; }
  .t-rock { background: #ff6b35; }
  .t-rnb { background: #9b6bff; }
  .t-hiphop { background: #6aa8ff; }
  .t-dance { background: #00c853; }
  .t-charts { background: #6b7a00; }
  .t-sing { background: #ff5a6e; }
  .t-dj { background: linear-gradient(135deg, #ff00ff, #00ffff, #ffcc00); color: #000; }

  /* Now Playing persis iPhone */
  .now-playing {
    position: fixed;
    bottom: 72px;
    left: 10px;
    right: 10px;
    background: #252527;
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .np-thumb {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    flex-shrink: 0;
  }
  .np-info { flex: 1; min-width: 0; }
  .np-info b { display: block; font-size: 15px; font-weight: 600; }
  .np-info p { margin: 1px 0 0; font-size: 13px; color: #98989d; }
  .np-play {
    width: 32px;
    height: 32px;
    background: #3a3a3c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a84ff;
    font-size: 16px;
  }

  /* Dock / Tab Bar persis iPhone */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000;
    border-top: 0.5px solid #2c2c2e;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 28px;
    z-index: 100;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #98989d;
    font-size: 10px;
  }
  .tab-item.active {
    color: #fff;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    margin-bottom: 3px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Search</h1>
  <div class="avatar">RL</div>
</div>

<div class="search-bar">
  <div class="icon-search"></div>
  <span>Artists, Songs, Lyrics, and More</span>
</div>

<div class="grid">
  <div class="tile t-radio"><span>Apple Music Radio</span></div>
  <div class="tile t-kpop"><span>K-Pop</span></div>
  <div class="tile t-indo"><span>Indonesian Music</span></div>
  <div class="tile t-pop"><span>Pop</span></div>
  <div class="tile t-alt"><span>Alternative</span></div>
  <div class="tile t-rock"><span>Rock</span></div>
  <div class="tile t-rnb"><span>R&B</span></div>
  <div class="tile t-hiphop"><span>Hip-Hop/Rap</span></div>
  <div class="tile t-dance"><span>Dance</span></div>
  <div class="tile t-charts"><span>Charts</span></div>
  <div class="tile t-sing"><span>Sing</span></div>
  <div class="tile t-dj"><span>DJ with Apple Music</span></div>
</div>

<div class="now-playing">
  <div class="np-thumb"></div>
  <div class="np-info">
    <b>lovely</b>
    <p>Billie Eilish & Khalid</p>
  </div>
  <div class="np-play">▶</div>
</div>

<div class="tabbar">
  <div class="tab-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 10.5 L12 3 L21 10.5 V20.5 H14.5 V14.5 H9.5 V20.5 H3 Z"/>
    </svg>
    Home
  </div>
  <div class="tab-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    Search
  </div>
</div>

</body>
</html>
