<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp</title>
  <link rel="stylesheet" href="whatsapp.css">
</head>
<body>
 <div class="wa-container">
  <h1 class="wa-title">Chats</h1>

  <div class="wa-search">
    <span class="wa-search-icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#667781" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
    </span>
    <span>Ask Meta AI or Search</span>
  </div>

  <div class="wa-chat">
    <img src="homescreen.jpg" class="wa-ava">
    <div class="wa-info">
      <b>nadi</b>
      <p>aku sayang kamu</p>
    </div>
    <span class="wa-time">13.01</span>
  </div>

  <div class="wa-chat">
    <div class="wa-ava">A</div>
    <div class="wa-info">
      <b>Anzel Kingdom</b>
      <p>✓ bikin inian met sebagai penanda</p>
    </div>
    <span class="wa-time">07.30</span>
  </div>

 <div class="wa-dock">
  <a href="#" class="wa-dock-item">
    <div class="wa-dock-icon">◐</div>
    <span>Updates</span>
  </a>
  <a href="#" class="wa-dock-item">
    <div class="wa-dock-icon">📞</div>
    <span>Calls</span>
  </a>
  <a href="#" class="wa-dock-item">
    <div class="wa-dock-icon">👥</div>
    <span>Communities</span>
  </a>
  <a href="#" class="wa-dock-item active">
    <div class="wa-dock-icon">💬<span class="wa-badge">16</span></div>
    <span>Chats</span>
  </a>
  <a href="index.html" class="wa-dock-item">
    <div class="wa-dock-icon">😊</div>
    <span>You</span>
  </a>
</div>
</body>
</html>
